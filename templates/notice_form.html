<form method="post" action="/operator/notice" class="form"><input type="hidden" name="csrf" value="{{csrf}}">{% if n %}<input type="hidden" name="id" value="{{n.id}}">{% endif %}<label>Title<input name="title" maxlength="120" value="{{n.title if n else ''}}" required></label><label>Message<textarea name="body" required>{{n.body if n else ''}}</textarea></label><label>Category<select name="category">{% for c in ['Community','Transport','Safety'] %}<option {{'selected' if n and n.category==c else ''}}>{{c}}</option>{% endfor %}</select></label><label>Publisher<input name="publisher" value="{{n.publisher if n else 'PerkFi demonstration team'}}" required></label><label>Source URL<input name="source" type="url" value="{{n.source if n else ''}}"></label><label>Expiry (Malaysia time)<input type="datetime-local" name="expires" value="{{expiry if expiry else ''}}" required></label><label class="check"><input type="checkbox" name="published" value="yes" {{'checked' if n and n.published else ''}}> Publish on the public portal</label><button>Save notice</button></form>
