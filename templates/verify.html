{% extends 'base.html' %}{% block content %}<form method="post" class="form"><input type="hidden" name="csrf" value="{{csrf}}">{% if console %}<p class="message">Test delivery: read the verification code in the application terminal.</p>{% else %}<p>Check the email address or phone number you entered.</p>{% endif %}<label>Six-digit verification code<input name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required></label><button>Verify and continue</button><a href="/login">Request another code or change contact</a></form>{% endblock %}
