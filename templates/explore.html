{% extends 'base.html' %}{% block content %}<form method="get" class="inline"><label>Search places or categories<input name="q" value="{{q}}" placeholder="Library, food, events…"></label><button>Search</button></form><div class="grid">{% for p in places %}<article><p class="meta">{{p.category}}</p><h2><a href="/place/{{p.id}}">{{p.name}}</a></h2><p>{{p.description}}</p><small>{{p.hours}}</small></article>{% else %}<p>No matches. Try another search.</p>{% endfor %}</div>{% endblock %}
